name: veo-watchdog

on:
  schedule:
    - cron: "*/5 * * * *"   # re-arms the loop; the job itself checks every 60s
  workflow_dispatch:          # allow manual run for testing

concurrency:
  group: watchdog
  cancel-in-progress: true

permissions:
  contents: write             # needed to remember state between runs

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run watchdog
        env:
          FALIX_KEY: ${{ secrets.FALIX_KEY }}
          FALIX_KEY2: ${{ secrets.FALIX_KEY2 }}
          BH_KEY: ${{ secrets.BH_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GHTOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHREPO: ${{ github.repository }}
        run: node watchdog.js
