name: veo-watchdog

on:
  schedule:
    - cron: "23 * * * *"   # hourly single-pass check (quota diet)
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run watchdog (watch + alert only, no repair)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GHTOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHREPO: ${{ github.repository }}
        run: node watchdog.js
